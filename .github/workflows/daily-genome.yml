name: Developer Genome Daily Workflow

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME }}
      GITHUB_OWNER: ${{ vars.GITHUB_USERNAME }}
      GITHUB_ANALYTICS_REPO: ${{ github.event.repository.name }}
      TIMEZONE: Asia/Kolkata
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      TZ: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run backend tests
        run: python -m pytest backend -q

      - name: Generate daily analytics snapshot
        run: |
          if [ -z "${GITHUB_USERNAME}" ]; then
            echo "GITHUB_USERNAME is required. Set the repository variable before running the workflow." >&2
            exit 1
          fi
          python backend/analytics_engine.py --username "$GITHUB_USERNAME" --token "$GH_TOKEN"

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data dashboard reports
          if git diff --cached --quiet; then
            echo "No generated changes to commit; skipping empty commit." 
          else
            git commit -m "chore: update developer genome - $(date -u +%Y-%m-%d)"
          fi

      - name: Push updates
        run: git push
